<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Словарь Бот</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #e8eaf6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a1d27;
            border-bottom: 1px solid #2e3350;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #4f8ef7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header h1 {
            font-size: 16px;
        }

        .header p {
            font-size: 12px;
            color: #3ddc97;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #2e3350; border-radius: 4px; }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bubble.user {
            background: #1e3a5f;
            border: 1px solid #2a4a7a;
            align-self: flex-end;
        }

        .bubble.user::before {
            content: '👤 Вы';
            display: block;
            font-size: 11px;
            color: #4f8ef7;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .bubble.bot {
            background: #1e2235;
            border: 1px solid #2e3350;
            align-self: flex-start;
        }

        .bubble.bot::before {
            content: '🤖 IT-Бот';
            display: block;
            font-size: 11px;
            color: #7c5cfc;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .input-area {
            background: #1a1d27;
            border-top: 1px solid #2e3350;
            padding: 14px 20px;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        .input-form input {
            flex: 1;
            background: #22263a;
            border: 1px solid #2e3350;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 14px;
            color: #e8eaf6;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .input-form input:focus {
            border-color: #4f8ef7;
        }

        .input-form input::placeholder {
            color: #8892b0;
        }

        .btn-send {
            background: #4f8ef7;
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-send:hover {
            background: #3a7ae0;
        }

        .sidebar {
            width: 260px;
            background: #1a1d27;
            border-left: 1px solid #2e3350;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            padding: 16px 20px;
            font-size: 12px;
            font-weight: bold;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2e3350;
        }
        .add-form {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #2e3350;
        }

        .add-form input,
        .add-form textarea {
            background: #22263a;
            border: 1px solid #2e3350;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            color: #e8eaf6;
            outline: none;
            font-family: Arial, sans-serif;
            width: 100%;
        }

        .add-form input:focus,
        .add-form textarea:focus {
            border-color: #7c5cfc;
        }

        .add-form input::placeholder,
        .add-form textarea::placeholder {
            color: #8892b0;
        }

        .add-form textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn-add {
            background: #22263a;
            border: 1px solid #7c5cfc;
            border-radius: 8px;
            padding: 9px;
            color: #7c5cfc;
            font-size: 13px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:hover {
            background: #7c5cfc;
            color: white;
        }

        .commands {
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .commands-label {
            font-size: 11px;
            font-weight: bold;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .cmd-btn {
            background: transparent;
            border: 1px solid #2e3350;
            border-radius: 6px;
            padding: 8px 12px;
            color: #8892b0;
            font-size: 13px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            text-align: left;
        }

        .cmd-btn:hover {
            border-color: #4f8ef7;
            color: #4f8ef7;
        }

        @media (max-width: 700px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-avatar">🤖</div>
    <div>
        <h1>IT-Словарь Бот</h1>
        <p>● онлайн</p>
    </div>
</div>

<div class="main">

    <div class="chat-area">
        <div class="messages" id="messages">
            {% if messages %}
                {% for msg in messages %}
                <div class="bubble user">{{ msg.user_text }}</div>
                <div class="bubble bot">{{ msg.bot_response }}</div>
                {% endfor %}
            {% else %}
                <div class="bubble bot">👋 Привет! Напиши IT-термин или используй /help</div>
            {% endif %}
        </div>

        <div class="input-area">
            <form class="input-form" method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <input type="text" name="user_text" id="userInput"
                       placeholder="Напиши термин или /help..." autocomplete="off" autofocus>
                <button type="submit" class="btn-send">➤</button>
            </form>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-title">📌 Добавить термин</div>

        <form class="add-form" method="POST" action="{% url 'add_term' %}">
            {% csrf_token %}
            <input type="text" name="word" placeholder="Термин" required>
            <textarea name="definition" placeholder="Определение..." required></textarea>
            <button type="submit" class="btn-add">+ Сохранить в базу</button>
        </form>

        <div class="commands">
            <div class="commands-label">⚡ Команды</div>
            <button class="cmd-btn" onclick="fillInput('/help')">/help — справка</button>
            <button class="cmd-btn" onclick="fillInput('/list')">/list — все термины</button>
            <button class="cmd-btn" onclick="fillInput('/about')">/about — о боте</button>
            <button class="cmd-btn" onclick="fillInput('/clear')">/clear — очистить чат</button>
            <button class="cmd-btn" onclick="fillInput('/start')">/start — приветствие</button>
        </div>
    </div>

</div>

<script>
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;

    function fillInput(text) {
        document.getElementById('userInput').value = text;
        document.getElementById('userInput').focus();
    }

    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            this.closest('form').submit();
        }
    });
</script>

</body>
</html>
